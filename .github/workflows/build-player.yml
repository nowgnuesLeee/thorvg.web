name: Lottie Player

on:
  push:
    branches:
      - main
    paths:
      - 'packages/lottie-player/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-player.yml'
      - '!**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/lottie-player/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-player.yml'
      - '!**/*.md'

jobs:
  build-wasm:
    name: Build WASM (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [default, sw, gl, wg, sw-lite, gl-lite, wg-lite, pthread]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.0
          actions-cache-folder: 'emsdk-cache'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip
          pip install meson==1.10.0

      - name: Verify build tools installation
        run: |
          emcc --version
          meson --version
          ninja --version

      - name: Build WASM
        working-directory: packages/lottie-player
        run: sh ./wasm_player_setup.sh ${{ matrix.preset }}

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.preset }}
          path: packages/lottie-player/dist/
          if-no-files-found: error

  build-player:
    name: Build and Validate Lottie Player
    needs: build-wasm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wasm-*
          path: packages/lottie-player/dist/
          merge-multiple: true

      - name: Build Lottie Player
        run: pnpm --filter @thorvg/lottie-player build:js

      - name: Check build artifacts
        run: |
          ls -lah packages/lottie-player/dist/
          echo "✅ Lottie Player build completed successfully"

      - name: Run component tests
        run: pnpm --filter @thorvg/lottie-player test

name: WebCanvas

on:
  push:
    branches:
      - main
    paths:
      - 'packages/webcanvas/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-wcanvas.yml'
      - '!**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/webcanvas/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-wcanvas.yml'
      - '!**/*.md'

jobs:
  build-wasm:
    name: Build WASM (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [default, pthread]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.0
          actions-cache-folder: 'emsdk-cache'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip
          pip install meson==1.10.0

      - name: Verify build tools installation
        run: |
          emcc --version
          meson --version
          ninja --version

      - name: Build WASM
        working-directory: packages/webcanvas
        run: sh ./wasm_wcanvas_setup.sh ${{ matrix.mode }}

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.mode }}
          path: packages/webcanvas/dist/
          if-no-files-found: error

  build-wcanvas:
    name: Build and Validate WebCanvas
    needs: build-wasm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wasm-*
          path: packages/webcanvas/dist/
          merge-multiple: true

      - name: Build WebCanvas
        run: pnpm --filter @thorvg/webcanvas build:js

      - name: Check build artifacts
        run: |
          ls -lah packages/webcanvas/dist/
          echo "✅ WebCanvas build completed successfully"

      - name: Run unit tests
        run: pnpm --filter @thorvg/webcanvas test

      - name: Install Browser tools for Playwright
        run: |
          sudo apt-get install -y xvfb
          pnpm --filter @thorvg/webcanvas exec playwright install --with-deps chromium

      - name: Run browser tests (SW renderer)
        run: xvfb-run pnpm --filter @thorvg/webcanvas test:sw

      - name: Run browser tests (WebGL)
        run: xvfb-run pnpm --filter @thorvg/webcanvas test:gl

      - name: Run browser tests (WebGPU)
        run: pnpm --filter @thorvg/webcanvas test:wg
